name: Build LeTV boot bridge
on:
  push:
    branches: [letv-boot-bridge]
    paths: ['letv-boot/**', '.github/workflows/letv-boot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p letv-boot :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: letv-boot-bridge-apk
          path: letv-boot/app/build/outputs/apk/debug/app-debug.apk
