name: Publish v2.0
on:
  push:
    paths:
      - .github/workflows/publish-v2.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the requested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/13031413733/zip > artifact.zip
          unzip artifact.zip -d artifact
          mv artifact/app-debug.apk cinema-bridge-v2.0-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0 cinema-bridge-v2.0-debug.apk --repo "${{ github.repository }}" --target e9b82dc12d2deffbf305993d76071a8730202254 --title "Cinema Bridge 2.0" --notes "选择遥控器同步院线键启动的应用。此 APK 为调试签名版本；与其他构建的签名可能不同，覆盖安装可能失败。"
